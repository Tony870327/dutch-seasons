name: Sync approved festivals from Google Sheets
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate synchronization code
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Read approved Google Sheets data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_sheets.py
      - name: Commit changed festival data
        run: |
          if git diff --quiet -- festivals-data.json; then
            echo 'No festival changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add festivals-data.json
            git commit -m 'Sync approved festivals from Google Sheets'
            git push
          fi
