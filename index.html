let lang='zh',view='calendar',year=2027,month=1,category=new Set(),province='',monthFilter='',query='';
const cats=['傳統與民俗','花卉與季節','美食','文化與藝術','地方特色慶典'];
const catEN={'傳統與民俗':'Traditions & folklore','花卉與季節':'Flowers & seasons','美食':'Food','文化與藝術':'Arts & culture','地方特色慶典':'Local celebrations'};
const monthsZH=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];const monthsEN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const t=(zh,en)=>lang==='zh'?zh:en;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(s){return s?new Date(s+'T12:00:00'):null}function ym(d){return d.getFullYear()*12+d.getMonth()}function monthNums(s){let a=[...s.matchAll(/\d+/g)].map(x=>+x[0]);if(s.includes('翌年'))return [11,12,1];if(a.length===2){let z=[];for(let i=a[0];i<=a[1];i++)z.push(i);return z}return a.length?[a[0]]:[]}
function occurs(e,d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12); if(e.kind==='seasonal'){if(e.id==='S03-02')return d>=parse(e.start)&&d<=parse(e.end);return monthNums(e.months).includes(d.getMonth()+1)}if(!e.start)return false;let a=parse(e.start),b=parse(e.end);if(e.kind==='weeklyFri'||e.kind==='weeklyThu')return d>=a&&d<=b&&d.getDay()===(e.kind==='weeklyFri'?5:4);return d>=a&&d<=b}
function monthMatches(e,m){if(e.kind==='seasonal')return monthNums(e.months).includes(m);if(e.kind==='historical')return monthNums(e.months).includes(m);let a=parse(e.start),b=parse(e.end);if(!a||!b)return monthNums(e.months).includes(m);for(let i=0;i<12;i++){let z=new Date(2027,i,15);if((a.getMonth()===i||b.getMonth()===i||(ym(a)<ym(z)&&ym(b)>ym(z)))){if(i+1===m)return true}}return false}
function filtered(){return DATA.filter(e=>(!province||e.province===province)&&(!monthFilter||monthMatches(e,+monthFilter))&&(!category.size||[...category].some(c=>e.cats.includes(c)))&&(!query||[e.zh,e.en,e.nl,e.city,e.province,e.id].join(' ').toLowerCase().includes(query.toLowerCase())))}
function status(e){if(e.kind==='historical')return t('2026 年參考資料','2026 reference');if(e.kind==='estimated')return t('依慣例推算','Estimated');if(e.kind==='seasonal')return t('自然花期／季節','Seasonal / bloom estimate');if(e.kind==='fixed')return t('固定日期，節目待公布','Fixed date, program pending');return t('2027 年已確認','2027 confirmed')}
function dateLabel(e){if(e.kind==='seasonal'&&e.id!=='S03-02')return t('通常 '+e.months,e.id==='S03-01'?'Usually March–April':'Usually August–September');if(!e.start)return e.months;let a=e.start,b=e.end;if(e.kind==='weeklyFri')return t('3/26–9/24，每週五','Mar 26–Sep 24, Fridays');if(e.kind==='weeklyThu')return t('4/1–8/26，每週四','Apr 1–Aug 26, Thursdays');return a.slice(0,4)+' · '+a.slice(5).replace('-','/')+(a===b?'':' – '+b.slice(5).replace('-','/'))}
function drawFilters(){let prov=[...new Set(DATA.map(e=>e.province))].sort();document.querySelector('#province').innerHTML='<option value="">'+t('全部省份','All provinces')+'</option>'+prov.map(p=>'<option '+(province===p?'selected':'')+'>'+esc(p)+'</option>').join('');document.querySelector('#monthFilter').innerHTML='<option value="">'+t('所有月份','All months')+'</option>'+monthsZH.map((x,i)=>'<option value="'+(i+1)+'" '+(monthFilter==i+1?'selected':'')+'>'+t(x,monthsEN[i])+'</option>').join('');document.querySelector('#chips').innerHTML=cats.map(c=>'<button class="chip '+(category.has(c)?'active':'')+'" data-cat="'+c+'">'+esc(t(c,catEN[c]))+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{let c=b.dataset.cat;category.has(c)?category.delete(c):category.add(c);render()})}
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelector('#zh').classList.toggle('active',lang==='zh');document.querySelector('#en').classList.toggle('active',lang==='en');document.querySelector('#headline').textContent=t('在荷蘭，遇見每個季節。','A year of Dutch discoveries.');document.querySelector('#intro').innerHTML=lang==='zh'?'從城市嘉年華、起司市集到春日花季，用一份行事曆探索荷蘭各地的文化與<span style="white-space:nowrap">節慶。</span>':'From lively carnivals and cheese markets to spring blossoms, discover Dutch traditions one month at a time.';document.querySelector('#sectionTitle').textContent=t('節慶行事曆','Festival calendar');document.querySelector('#search').placeholder=t('搜尋節慶、城市或荷蘭文名稱…','Search festivals, cities or Dutch names…');document.querySelector('#monthTitle').textContent=year+' · '+t(monthsZH[month],monthsEN[month]);document.querySelector('#calbtn span').textContent=t('月曆','Calendar');document.querySelector('#listbtn span').textContent=t('活動列表','List');document.querySelector('#calbtn').classList.toggle('active',view==='calendar');document.querySelector('#listbtn').classList.toggle('active',view==='list');document.querySelector('#footer').textContent=t('活動日期可能異動，出發前請以主辦單位官方公告為準。','Event dates may change. Please check the organizer’s official website before visiting.');drawFilters();view==='calendar'?drawCalendar():drawList()}
function drawCalendar(){let entries=filtered();let first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),html='<div class="calendar">';for(let i=0;i<7;i++)html+='<div class="weekday">'+(lang==='zh'?['一','二','三','四','五','六','日'][i]:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i])+'</div>';for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){let day=i-offset+1,valid=day>0&&day<=days,d=new Date(year,month,day),events=valid?entries.filter(e=>occurs(e,d)):[];html+='<div class="day '+(valid?'':'outside')+'"><div class="num">'+(valid?day:'')+'</div>';for(let e of events)html+='<button class="eventpill '+(e.kind==='historical'?'old':e.kind==='seasonal'?'season':'')+'" data-id="'+e.id+'" title="'+esc(e.zh)+'">'+esc(lang==='zh'?e.zh:e.en)+'</button>';html+='</div>'}html+='</div>';document.querySelector('#content').innerHTML=html;bindDetails()}
function locationLabel(e){const city=e.city==='全國'?t('全國','Nationwide'):e.city;const prov=e.province==='全國'?t('全國','Nationwide'):e.province;return city===prov?city:city+' · '+prov}
function drawList(){let entries=filtered().filter(e=>monthMatches(e,month+1)).sort((a,b)=>a.id.localeCompare(b.id));if(!entries.length){document.querySelector('#content').innerHTML='<div class="empty">'+t('本月沒有符合條件的活動，試試其他月份或清除篩選。','No matching events this month. Try another month or clear filters.')+'</div>';return}document.querySelector('#content').innerHTML='<div class="list">'+entries.map(e=>'<article class="card"><div class="card-top"><span class="mon">'+String(+e.id.slice(1,3)).padStart(2,'0')+'</span><span class="id">'+e.id+'</span></div><div class="card-body"><div class="status">'+status(e)+'</div><h3>'+esc(lang==='zh'?e.zh:e.en)+'</h3><div class="sub">'+esc(e.nl)+'</div><div class="meta">⌁ '+esc(locationLabel(e))+'<br>◷ '+esc(dateLabel(e))+'</div>'+e.cats.map(c=>'<span class="tag">'+esc(t(c,catEN[c]))+'</span>').join('')+'</div><button class="detail" data-id="'+e.id+'">'+t('查看活動詳情 →','Explore event →')+'</button></article>').join('')+'</div>';bindDetails()}
function bindDetails(){document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showDetail(b.dataset.id))}function showDetail(id){let e=DATA.find(x=>x.id===id);if(!e)return;document.querySelector('#dialogContent').innerHTML='<div class="eyebrow">'+e.id+' · '+esc(status(e))+'</div><h2>'+esc(lang==='zh'?e.zh:e.en)+'</h2><p class="sub">'+esc(e.nl)+'</p><p><strong>'+t('地點','Location')+'：</strong>'+esc(locationLabel(e))+'</p><p><strong>'+t('日期','Dates')+'：</strong>'+esc(dateLabel(e))+'</p><p><strong>'+t('活動與日期說明','Event and date notes')+'：</strong>'+esc(t(e.note,e.noteEn))+'</p><p>'+e.cats.map(c=>'<span class="tag">'+esc(t(c,catEN[c]))+'</span>').join('')+'</p>'+(e.url?'<a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(e.url)+'">'+t('前往官方網站 ↗','Official website ↗')+'</a>':'');document.querySelector('#detailDialog').showModal()}
document.querySelector('#zh').onclick=()=>{lang='zh';render()};document.querySelector('#en').onclick=()=>{lang='en';render()};document.querySelector('#calbtn').onclick=()=>{view='calendar';render()};document.querySelector('#listbtn').onclick=()=>{view='list';render()};document.querySelector('#prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};document.querySelector('#next').onclick=()=>{month++;if(month>11){month=0;year++}render()};document.querySelector('#search').oninput=e=>{query=e.target.value;view==='calendar'?drawCalendar():drawList()};document.querySelector('#province').onchange=e=>{province=e.target.value;render()};document.querySelector('#monthFilter').onchange=e=>{monthFilter=e.target.value;if(monthFilter)month=+monthFilter-1;render()};document.querySelector('#close').onclick=()=>document.querySelector('#detailDialog').close();render();
</script></body></html>
