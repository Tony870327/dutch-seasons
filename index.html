<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荷蘭節慶日曆 | Dutch Seasons</title><style>
:root{--ink:#25392f;--muted:#718177;--cream:#f8f7f1;--green:#355d4d;--border:#e4e8e0;--orange:#c77d51}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,'Noto Sans TC','Segoe UI',sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--border);padding:19px max(24px,calc((100vw - 1220px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:-.5px;font-weight:bold}.brand span{color:var(--orange)}.top{display:flex;align-items:center;gap:9px}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c77d51;outline-offset:2px}.lang{border:1px solid var(--border);background:white;padding:8px 12px;border-radius:25px}.lang.active{background:var(--ink);color:white}main{max-width:1220px;margin:auto;padding:32px 24px 70px}.eyebrow{text-transform:uppercase;letter-spacing:3px;color:var(--orange);font-size:11px;font-weight:700}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.hero h1{font:normal clamp(35px,5vw,62px)/1.12 Georgia,serif;letter-spacing:-1.5px;margin:11px 0}.hero p{color:var(--muted);margin:0;max-width:900px;line-height:1.8}@media(min-width:1100px){.hero p{white-space:nowrap}}.hero .decor{font:italic 105px Georgia,serif;color:#d9dfd3;line-height:.8}.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;background:#fff;padding:17px;border:1px solid var(--border);border-radius:15px;margin:25px 0}.controls input,.controls select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}.chip{border:1px solid var(--border);background:#fff;padding:8px 12px;border-radius:30px;color:var(--ink);font-size:13px}.chip.active{background:#e3eae2;border-color:#7a9b87}.viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}.viewbar h2{font:normal 26px Georgia,serif;margin:0}.viewbuttons{display:flex;gap:5px}.viewbuttons button,.nav button{border:1px solid var(--border);background:white;border-radius:8px;padding:9px 13px}.viewbuttons button.active{background:var(--green);color:white}.nav{display:flex;align-items:center;gap:12px}.nav strong{min-width:145px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.weekday{padding:12px;text-align:center;font-size:12px;color:var(--muted);background:#f1f3ee;border-bottom:1px solid var(--border)}.day{min-height:116px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;overflow:hidden}.day:nth-child(7n){border-right:0}.day.outside{background:#f8f9f6;color:#b3bbb2}.num{font-size:12px;font-weight:600;margin-bottom:7px}.eventpill{display:block;width:100%;text-align:left;border:0;border-left:3px solid #6c9781;background:#edf4ed;color:#355a47;padding:5px 6px;margin:3px 0;border-radius:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eventpill.old{border-color:#c9a480;background:#f9f1e7;color:#826344}.eventpill.season{border-color:#9a8cb4;background:#f0edf5;color:#68587f}.more{font-size:11px;color:var(--muted)}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card-top{height:100px;background:#e5e9df;display:flex;align-items:center;justify-content:space-between;padding:22px}.card-top .mon{font:italic 38px Georgia,serif;color:#6c8976}.card-top .id{font-size:12px;color:#698174}.card-body{padding:19px;flex:1}.card h3{font:normal 23px Georgia,serif;margin:10px 0 4px}.sub{font-size:12px;color:var(--muted)}.meta{margin:13px 0;color:#4f6356;font-size:13px;line-height:1.8}.tag{display:inline-block;font-size:11px;border-radius:20px;background:#eef1e9;padding:5px 9px;margin:0 4px 5px 0}.status{font-size:11px;color:#806a46}.card button.detail{border:0;border-top:1px solid var(--border);background:white;text-align:left;padding:15px 19px;color:var(--green);font-weight:600}.empty{padding:55px;text-align:center;background:white;border:1px solid var(--border);border-radius:12px;color:var(--muted)}dialog{border:0;border-radius:16px;max-width:620px;width:calc(100% - 30px);padding:0;box-shadow:0 22px 80px #152c2240;color:var(--ink)}dialog::backdrop{background:#1a2925aa}.dialoginner{padding:30px}.dialoginner h2{font:normal 34px Georgia,serif;margin:9px 0}.dialoginner p{line-height:1.75}.close{float:right;border:0;background:#edf0ea;border-radius:50%;height:33px;width:33px}.link{display:inline-block;background:var(--green);color:white;padding:12px 16px;border-radius:7px;text-decoration:none;margin-top:12px}.foot{margin-top:30px;color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:760px){header{padding:15px 20px}.brand{font-size:20px}.hero .decor{display:none}.controls{grid-template-columns:1fr}.list{grid-template-columns:1fr 1fr}.day{min-height:87px;padding:4px}.eventpill{font-size:9px;padding:4px 2px}.weekday{padding:8px 2px}}@media(max-width:510px){.list{grid-template-columns:1fr}.hero h1{font-size:39px}.day{min-height:69px}.eventpill{font-size:9px;min-height:20px;padding:3px 2px;border-left-width:2px;white-space:normal;overflow-wrap:anywhere}.more{font-size:9px}.nav strong{min-width:110px}}
</style></head><body><header><div class="brand">Dutch <span>Seasons.</span></div><div class="top"><button id="zh" class="lang active">繁中</button><button id="en" class="lang">EN</button></div></header><main><section class="hero"><div><div class="eyebrow">A CALENDAR OF DUTCH CULTURE & SEASONS</div><h1 id="headline">在荷蘭，遇見每個季節。</h1><p id="intro">從城市嘉年華、起司市集到春日花季，用一份行事曆探索荷蘭各地的文化與節慶。</p></div><div class="decor">NL.</div></section><section class="controls"><input id="search" placeholder="搜尋節慶、城市或荷蘭文名稱…" aria-label="search"><select id="province" aria-label="province"></select><select id="monthFilter" aria-label="month"></select></section><div id="chips" class="chips"></div><div class="viewbar"><h2 id="sectionTitle">節慶行事曆</h2><div class="viewbuttons"><button id="calbtn" class="active">▦ <span data-zh="月曆" data-en="Calendar">月曆</span></button><button id="listbtn">☷ <span data-zh="活動列表" data-en="List">活動列表</span></button></div><div class="nav"><button id="prev" aria-label="previous month">‹</button><strong id="monthTitle"></strong><button id="next" aria-label="next month">›</button></div></div><div id="content"></div><p class="foot" id="footer">活動日期可能異動，出發前請以主辦單位官方公告為準。</p></main><dialog id="detailDialog"><div class="dialoginner"><button class="close" id="close" aria-label="close">×</button><div id="dialogContent"></div></div></dialog><script>
let DATA=[];
let lang='zh',view='calendar',year=2027,month=1,category=new Set(),province='',monthFilter='',query='';
const cats=['傳統與民俗','花卉與季節','美食','文化與藝術','地方特色慶典'];
const catEN={'傳統與民俗':'Traditions & folklore','花卉與季節':'Flowers & seasons','美食':'Food','文化與藝術':'Arts & culture','地方特色慶典':'Local celebrations'};
const monthsZH=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];const monthsEN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const t=(zh,en)=>lang==='zh'?zh:en;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(s){return s?new Date(s+'T12:00:00'):null}function ym(d){return d.getFullYear()*12+d.getMonth()}function monthNums(s){let a=[...s.matchAll(/\d+/g)].map(x=>+x[0]);if(s.includes('翌年'))return [11,12,1];if(a.length===2){let z=[];for(let i=a[0];i<=a[1];i++)z.push(i);return z}return a.length?[a[0]]:[]}
function occurs(e,d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12); if(e.kind==='seasonal'){if(e.start&&e.end)return d>=parse(e.start)&&d<=parse(e.end);return (e.seasonMonths||monthNums(e.months)).includes(d.getMonth()+1)}if(!e.start)return false;let a=parse(e.start),b=parse(e.end);if(e.kind==='weeklyFri'||e.kind==='weeklyThu'){if(d<a||d>b)return false;const days={SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};return (e.weeklyRules||[{weekday:e.kind==='weeklyFri'?'FRI':'THU',months:null}]).some(rule=>days[rule.weekday]===d.getDay()&&(!rule.months||rule.months.includes(d.getMonth()+1)))}return d>=a&&d<=b}
function monthMatches(e,m){if(e.kind==='seasonal')return (e.seasonMonths||monthNums(e.months)).includes(m);if(e.kind==='historical')return monthNums(e.months).includes(m);let a=parse(e.start),b=parse(e.end);if(!a||!b)return monthNums(e.months).includes(m);for(let i=0;i<12;i++){let z=new Date(2027,i,15);if((a.getMonth()===i||b.getMonth()===i||(ym(a)<ym(z)&&ym(b)>ym(z)))){if(i+1===m)return true}}return false}
function filtered(){return DATA.filter(e=>(!province||e.province===province)&&(!monthFilter||monthMatches(e,+monthFilter))&&(!category.size||[...category].some(c=>e.cats.includes(c)))&&(!query||[e.zh,e.en,e.nl,e.city,e.province,e.id].join(' ').toLowerCase().includes(query.toLowerCase())))}
function status(e){if(e.kind==='historical')return t('2026 年參考資料','2026 reference');if(e.kind==='estimated')return t('依慣例推算','Estimated');if(e.kind==='seasonal')return t('自然花期／季節','Seasonal / bloom estimate');if(e.kind==='fixed')return t('固定日期，節目待公布','Fixed date, program pending');return t('2027 年已確認','2027 confirmed')}
function dateLabel(e){if(e.kind==='seasonal'&&!e.start)return t('通常 '+e.months,'Estimated months: '+(e.seasonMonths||monthNums(e.months)).join(', '));if(!e.start)return e.months;let a=e.start,b=e.end;if(e.kind==='weeklyFri'||e.kind==='weeklyThu')return a.slice(0,4)+' · '+a.slice(5).replace('-','/')+' – '+b.slice(5).replace('-','/')+' · '+(e.weeklyRules||[{weekday:e.kind==='weeklyFri'?'FRI':'THU',months:null}]).map(r=>r.weekday+(r.months?' ('+r.months.join(',')+')':'')).join('; ');return a.slice(0,4)+' · '+a.slice(5).replace('-','/')+(a===b?'':' – '+b.slice(5).replace('-','/'))}
function drawFilters(){let prov=[...new Set(DATA.map(e=>e.province))].sort();document.querySelector('#province').innerHTML='<option value="">'+t('全部省份','All provinces')+'</option>'+prov.map(p=>'<option value="'+esc(p)+'" '+(province===p?'selected':'')+'>'+esc(p==='全國'?t('全國','Nationwide'):p)+'</option>').join('');document.querySelector('#monthFilter').innerHTML='<option value="">'+t('所有月份','All months')+'</option>'+monthsZH.map((x,i)=>'<option value="'+(i+1)+'" '+(monthFilter==i+1?'selected':'')+'>'+t(x,monthsEN[i])+'</option>').join('');document.querySelector('#chips').innerHTML=cats.map(c=>'<button class="chip '+(category.has(c)?'active':'')+'" data-cat="'+c+'">'+esc(t(c,catEN[c]))+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{let c=b.dataset.cat;category.has(c)?category.delete(c):category.add(c);render()})}
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelector('#zh').classList.toggle('active',lang==='zh');document.querySelector('#en').classList.toggle('active',lang==='en');document.querySelector('#headline').textContent=t('在荷蘭，遇見每個季節。','A year of Dutch discoveries.');document.querySelector('#intro').innerHTML=lang==='zh'?'從城市嘉年華、起司市集到春日花季，用一份行事曆探索荷蘭各地的文化與<span style="white-space:nowrap">節慶。</span>':'From lively carnivals and cheese markets to spring blossoms, discover Dutch traditions one month at a time.';document.querySelector('#sectionTitle').textContent=t('節慶行事曆','Festival calendar');document.querySelector('#search').placeholder=t('搜尋節慶、城市或荷蘭文名稱…','Search festivals, cities or Dutch names…');document.querySelector('#monthTitle').textContent=year+' · '+t(monthsZH[month],monthsEN[month]);document.querySelector('#calbtn span').textContent=t('月曆','Calendar');document.querySelector('#listbtn span').textContent=t('活動列表','List');document.querySelector('#calbtn').classList.toggle('active',view==='calendar');document.querySelector('#listbtn').classList.toggle('active',view==='list');document.querySelector('#footer').textContent=t('活動日期可能異動，出發前請以主辦單位官方公告為準。','Event dates may change. Please check the organizer’s official website before visiting.');drawFilters();view==='calendar'?drawCalendar():drawList()}
function drawCalendar(){let entries=filtered();let first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),html='<div class="calendar">';for(let i=0;i<7;i++)html+='<div class="weekday">'+(lang==='zh'?['一','二','三','四','五','六','日'][i]:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i])+'</div>';for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){let day=i-offset+1,valid=day>0&&day<=days,d=new Date(year,month,day),events=valid?entries.filter(e=>occurs(e,d)):[];html+='<div class="day '+(valid?'':'outside')+'"><div class="num">'+(valid?day:'')+'</div>';for(let e of events)html+='<button class="eventpill '+(e.kind==='historical'?'old':e.kind==='seasonal'?'season':'')+'" data-id="'+e.id+'" title="'+esc(e.zh)+'">'+esc(lang==='zh'?e.zh:e.en)+'</button>';html+='</div>'}html+='</div>';document.querySelector('#content').innerHTML=html;bindDetails()}
function locationLabel(e){const city=e.city==='全國'?t('全國','Nationwide'):e.city;const prov=e.province==='全國'?t('全國','Nationwide'):e.province;return city===prov?city:city+' · '+prov}
function drawList(){let entries=filtered().filter(e=>monthMatches(e,month+1)).sort((a,b)=>a.id.localeCompare(b.id));if(!entries.length){document.querySelector('#content').innerHTML='<div class="empty">'+t('本月沒有符合條件的活動，試試其他月份或清除篩選。','No matching events this month. Try another month or clear filters.')+'</div>';return}document.querySelector('#content').innerHTML='<div class="list">'+entries.map(e=>'<article class="card"><div class="card-top"><span class="mon">'+String(+e.id.slice(1,3)).padStart(2,'0')+'</span><span class="id">'+e.id+'</span></div><div class="card-body"><div class="status">'+status(e)+'</div><h3>'+esc(lang==='zh'?e.zh:e.en)+'</h3><div class="sub">'+esc(e.nl)+'</div><div class="meta">⌁ '+esc(locationLabel(e))+'<br>◷ '+esc(dateLabel(e))+'</div>'+e.cats.map(c=>'<span class="tag">'+esc(t(c,catEN[c]))+'</span>').join('')+'</div><button class="detail" data-id="'+e.id+'">'+t('查看活動詳情 →','Explore event →')+'</button></article>').join('')+'</div>';bindDetails()}
function bindDetails(){document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showDetail(b.dataset.id))}function showDetail(id){let e=DATA.find(x=>x.id===id);if(!e)return;document.querySelector('#dialogContent').innerHTML='<div class="eyebrow">'+e.id+' · '+esc(status(e))+'</div><h2>'+esc(lang==='zh'?e.zh:e.en)+'</h2><p class="sub">'+esc(e.nl)+'</p><p><strong>'+t('地點','Location')+'：</strong>'+esc(locationLabel(e))+'</p><p><strong>'+t('日期','Dates')+'：</strong>'+esc(dateLabel(e))+'</p><p><strong>'+t('活動與日期說明','Event and date notes')+'：</strong>'+esc(t(e.note,e.noteEn))+'</p>'+(e.highlight?'<p><strong>'+t('重點場次','Highlights')+'：</strong>'+esc(t(e.highlight,e.highlightEn))+'</p>':'')+'<p>'+e.cats.map(c=>'<span class="tag">'+esc(t(c,catEN[c]))+'</span>').join('')+'</p>'+(e.url?'<a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(e.url)+'">'+t('前往官方網站 ↗','Official website ↗')+'</a>':'');document.querySelector('#detailDialog').showModal()}
document.querySelector('#zh').onclick=()=>{lang='zh';render()};document.querySelector('#en').onclick=()=>{lang='en';render()};document.querySelector('#calbtn').onclick=()=>{view='calendar';render()};document.querySelector('#listbtn').onclick=()=>{view='list';render()};document.querySelector('#prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};document.querySelector('#next').onclick=()=>{month++;if(month>11){month=0;year++}render()};document.querySelector('#search').oninput=e=>{query=e.target.value;view==='calendar'?drawCalendar():drawList()};document.querySelector('#province').onchange=e=>{province=e.target.value;render()};document.querySelector('#monthFilter').onchange=e=>{monthFilter=e.target.value;if(monthFilter)month=+monthFilter-1;render()};document.querySelector('#close').onclick=()=>document.querySelector('#detailDialog').close();async function loadFestivals(){try{const response=await fetch('./festivals-data.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!Array.isArray(result)||!result.length)throw new Error('Invalid festival data');DATA=result;render()}catch(err){console.error('Could not load festival data',err);document.querySelector('#content').innerHTML='<div class="empty">'+t('活動資料暫時無法載入，請稍後再試。','Festival data is temporarily unavailable. Please try again later.')+'</div>'}}
loadFestivals();
</script></body></html>
